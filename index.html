<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Store</title>

    <link rel="stylesheet" href="./styles/variables.css">
    <link rel="stylesheet" href="./styles/standard.css">
    <link rel="stylesheet" href="./styles/fonts.css">
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="stylesheet" href="./styles/book_card.css">
    <link rel="stylesheet" href="./styles/scrollbar.css">

    <script src="scripts/db.js"></script>
    <script src="scripts/templates.js"></script>
    <script src="scripts/store.js"></script>

    <link rel="shortcut icon" href="assets/icons/book_store_logo.svg" type="image/x-icon">
</head>

<body onload="initialize()">
    <header class="page-header">
        <img src="./assets/icons/book_store_logo.svg"
            alt="A minimalistic open book in front of a blue background - the logo of the book store.">
        <h1><strong>DA</strong> Book Store</h1>

        <div class="filter-button-wrapper">
            <button id="filterButton" class="filter-button" onclick="toggleLikedFilter()">
                <img src="./assets/icons/heart_black_outline.png" alt="Ein transparentes Herz mit schwarzer Außenlinie."
                    class="heart-button-img">
            </button>
            <label id="filterButtonLabel" for="filterButton"></label>
        </div>
    </header>

    <main>
        <section id="bookCardsSection">
        </section>
    </main>

    <footer class="page-footer">
    </footer>
</body>

</html>
